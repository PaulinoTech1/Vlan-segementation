# Backwards-compatibility shim. The audit entry point is now
# playbooks/audit_only.yml, which documents the AUDIT -> DETECT DRIFT ->
# REPORT separation. This file is kept so existing references and CI steps
# that call playbooks/audit.yml continue to work.
- name: Audit via the audit-only entry point
  ansible.builtin.import_playbook: audit_only.yml
