# Generic rsyslog forwarding example for security telemetry.
#
# PURPOSE: forward security-relevant syslog (auth, authpriv, daemon, and
# local0-local7, where most network devices log) to a central SIEM collector
# over TLS. This is an example only. Copy it, replace every value marked
# REPLACE, and test before relying on it.
#
# Every site-specific value below is marked with a "# REPLACE:" comment.
# No real destinations, certificates, or hostnames are included.

module(load="imuxsock")   # local system logging
module(load="imklog")     # kernel logging

# --- TLS driver setup (gtls) ---
# REPLACE: verify the driver name against your rsyslog version/distribution
# (some ship "ossl" instead of "gtls").
module(
  load="imtcp"
  StreamDriver.Name="gtls"
  StreamDriver.Mode="1"                # 1 = TLS mode on
  StreamDriver.AuthMode="x509/name"    # validate the collector certificate; do NOT use "anon"
)

# Global TLS certificate settings.
# REPLACE: point these at your PKI-issued files.
global(
  DefaultNetstreamDriverCAFile="/etc/rsyslog.d/certs/ca.pem"
  # REPLACE: CA certificate that signed the collector certificate
  DefaultNetstreamDriverCertFile="/etc/rsyslog.d/certs/client-cert.pem"
  # REPLACE: this forwarder's client certificate
  DefaultNetstreamDriverKeyFile="/etc/rsyslog.d/certs/client-key.pem"
  # REPLACE: this forwarder's private key (protect file permissions 0600)
)

# --- Forwarding action with a reliability queue ---
# REPLACE: siem-collector.example with your collector hostname.
# Port 6514 is the conventional syslog-over-TLS port; REPLACE if yours differs.
# REPLACE: the PermittedPeer value with your collector's certificate identity
# (usually its DNS name as it appears on the certificate).
action(
  type="omfwd"
  target="siem-collector.example"
  port="6514"
  protocol="tcp"
  StreamDriver="gtls"
  StreamDriverMode="1"
  StreamDriverAuthMode="x509/name"
  StreamDriverPermittedPeers="siem-collector.example"
  queue.type="LinkedList"        # in-memory assisted queue; tune to your loss tolerance
  queue.size="100000"            # REPLACE: max queued messages during a collector outage
  queue.saveonshutdown="on"     # attempt to preserve queued messages across restarts
  action.resumeRetryCount="-1"   # retry forever; never silently drop security telemetry
  action.resumeInterval="30"
)

# --- What gets forwarded ---
# Security-relevant facilities at notice severity and above. Adjust to taste.
# REPLACE: facility/severity selection to match your devices and log volume.
auth,authpriv.*                                          :omfwd:  # placeholder, see action above
daemon.*                                                :omfwd:
local0,local1,local2,local3,local4,local5,local6,local7.* :omfwd:

# Notes:
# - The rules above reference the forwarding action defined earlier in this
#   file; in a real rsyslog.conf they bind to the single omfwd action above.
#   If you split this snippet across files, use explicit action names.
# - Do NOT log or forward plaintext passwords, API keys, tokens, RADIUS
#   shared secrets, private keys, or certificates. Redact at the source where
#   the device supports it.
# - Keep device clocks on authenticated NTP/NTS so forwarded events carry
#   trustworthy UTC timestamps for SIEM correlation.
