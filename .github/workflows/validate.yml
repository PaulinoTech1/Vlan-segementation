name: Validate repository
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            ansible/requirements.txt
      - run: python -m pip install -r requirements-dev.txt -r ansible/requirements.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: ansible-galaxy collection install -r ansible/requirements.yml
      - run: python scripts/validate-ansible-models.py
      - name: Syntax-check playbooks (no device credentials or connection)
        working-directory: ansible
        run: |
          ansible-playbook playbooks/audit.yml --syntax-check
          ansible-playbook playbooks/enforce.yml --syntax-check
          ansible-playbook playbooks/validate-models.yml -i localhost,
      - name: Parse PowerShell
        shell: pwsh
        run: ./scripts/Test-PowerShellSyntax.ps1
